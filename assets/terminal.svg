<svg width="800" height="360" viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 10px; }
    .header-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 10px; }
    .header-title { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; }
    .term-text { font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-size: 13px; line-height: 1.6; }
    .prompt { fill: #00c2ff; font-weight: bold; }
    .path { fill: #d2a8ff; }
    .cmd { fill: #79c0ff; font-weight: bold; }
    .key { fill: #79c0ff; font-weight: bold; }
    .val { fill: #a5d6ff; }
    .bracket { fill: #ff7b72; }
    .success { fill: #56d364; font-weight: bold; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .l1 { animation: fadeIn 0.3s 0.2s forwards; }
    .l2 { animation: fadeIn 0.3s 0.5s forwards; }
    .l3 { animation: fadeIn 0.3s 0.8s forwards; }
    .l4 { animation: fadeIn 0.3s 1.1s forwards; }
    .l5 { animation: fadeIn 0.3s 1.4s forwards; }
    .l6 { animation: fadeIn 0.3s 1.7s forwards; }
    .l7 { animation: fadeIn 0.3s 2.0s forwards; }
    .l8 { animation: fadeIn 0.3s 2.3s forwards; }
    .l9 { animation: fadeIn 0.3s 2.6s forwards; }
    .cursor { animation: blink 1s infinite; fill: #00c2ff; }
  </style>

  <!-- Window Container -->
  <rect class="bg" x="1" y="1" width="798" height="358" rx="10" />
  
  <!-- Header Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 789 1 A 10 10 0 0 1 799 11 L 799 36 L 1 36 Z" fill="#161b22" />
  <line x1="1" y1="36" x2="799" y2="36" stroke="#30363d" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />
  <text x="76" y="22" class="header-title">axell@sysadmin: ~ / profile.json</text>

  <!-- Terminal Output -->
  <g class="term-text" transform="translate(24, 65)">
    <!-- Line 1 -->
    <g class="l1" transform="translate(0, 0)">
      <text x="0" y="0">
        <tspan class="prompt">axell@sysadmin</tspan>:<tspan class="path">~</tspan>$ <tspan class="cmd">cat profile.json</tspan>
      </text>
    </g>

    <!-- Line 2 -->
    <g class="l2" transform="translate(0, 24)">
      <text x="0" y="0"><tspan class="bracket">{</tspan></text>
    </g>

    <!-- Line 3 -->
    <g class="l3" transform="translate(0, 48)">
      <text x="0" y="0">
        <tspan class="key">&#160;&#160;&quot;Systems &amp; Infrastructure&quot;:</tspan> [<tspan class="val">&quot;Windows Server 2022&quot;</tspan>, <tspan class="val">&quot;AD DS&quot;</tspan>, <tspan class="val">&quot;GPOs&quot;</tspan>, <tspan class="val">&quot;Linux CIS L2&quot;</tspan>, <tspan class="val">&quot;Nginx&quot;</tspan>],
      </text>
    </g>

    <!-- Line 4 -->
    <g class="l4" transform="translate(0, 72)">
      <text x="0" y="0">
        <tspan class="key">&#160;&#160;&quot;Identity &amp; Cloud&quot;:</tspan> [<tspan class="val">&quot;Microsoft Entra ID&quot;</tspan>, <tspan class="val">&quot;Intune&quot;</tspan>, <tspan class="val">&quot;Azure&quot;</tspan>, <tspan class="val">&quot;OCI&quot;</tspan>, <tspan class="val">&quot;VMware&quot;</tspan>],
      </text>
    </g>

    <!-- Line 5 -->
    <g class="l5" transform="translate(0, 96)">
      <text x="0" y="0">
        <tspan class="key">&#160;&#160;&quot;Applied AI &amp; Workflows&quot;:</tspan> [<tspan class="val">&quot;RAG Pipelines&quot;</tspan>, <tspan class="val">&quot;LangChain&quot;</tspan>, <tspan class="val">&quot;n8n Automation&quot;</tspan>, <tspan class="val">&quot;FAISS&quot;</tspan>, <tspan class="val">&quot;Docker&quot;</tspan>],
      </text>
    </g>

    <!-- Line 6 -->
    <g class="l6" transform="translate(0, 120)">
      <text x="0" y="0">
        <tspan class="key">&#160;&#160;&quot;Automation &amp; Scripting&quot;:</tspan> [<tspan class="val">&quot;Python&quot;</tspan>, <tspan class="val">&quot;PowerShell&quot;</tspan>, <tspan class="val">&quot;Bash&quot;</tspan>, <tspan class="val">&quot;SQL (Postgres)&quot;</tspan>, <tspan class="val">&quot;Git&quot;</tspan>],
      </text>
    </g>

    <!-- Line 7 -->
    <g class="l7" transform="translate(0, 144)">
      <text x="0" y="0">
        <tspan class="key">&#160;&#160;&quot;Mission-Critical Background&quot;:</tspan> [<tspan class="val">&quot;Intel 24/7 Operations&quot;</tspan>, <tspan class="val">&quot;SLA Incident Triage&quot;</tspan>, <tspan class="val">&quot;SOP Compliance&quot;</tspan>],
      </text>
    </g>

    <!-- Line 8 -->
    <g class="l8" transform="translate(0, 168)">
      <text x="0" y="0">
        <tspan class="key">&#160;&#160;&quot;Status&quot;:</tspan> <tspan class="val">&quot;Open to Systems Administrator, Support &amp; Cloud Roles&quot;</tspan>
      </text>
    </g>

    <!-- Line 9 -->
    <g class="l9" transform="translate(0, 192)">
      <text x="0" y="0">
        <tspan class="bracket">}</tspan> <tspan class="success">[OK] READY</tspan>
      </text>
      <rect class="cursor" x="75" y="-12" width="8" height="15" />
    </g>
  </g>
</svg>