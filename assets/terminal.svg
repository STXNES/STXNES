<svg width="800" height="340" viewBox="0 0 800 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 10px; }
    .header-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 10px; }
    .header-title { font-family: 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #8b949e; }
    .term-text { font-family: 'Fira Code', Consolas, monospace; font-size: 13px; line-height: 1.6; }
    .prompt { fill: #2f81f7; font-weight: bold; }
    .path { fill: #d2a8ff; }
    .cmd { fill: #79c0ff; font-weight: bold; }
    .key { fill: #79c0ff; font-weight: bold; }
    .val { fill: #a5d6ff; }
    .bracket { fill: #ff7b72; }
    .success { fill: #56d364; font-weight: bold; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .l1 { opacity: 0; animation: fadeIn 0.3s 0.2s forwards; }
    .l2 { opacity: 0; animation: fadeIn 0.3s 0.6s forwards; }
    .l3 { opacity: 0; animation: fadeIn 0.3s 1.0s forwards; }
    .l4 { opacity: 0; animation: fadeIn 0.3s 1.4s forwards; }
    .l5 { opacity: 0; animation: fadeIn 0.3s 1.8s forwards; }
    .l6 { opacity: 0; animation: fadeIn 0.3s 2.2s forwards; }
    .l7 { opacity: 0; animation: fadeIn 0.3s 2.6s forwards; }
    .l8 { opacity: 0; animation: fadeIn 0.3s 3.0s forwards; }
    .cursor { animation: blink 1s infinite; fill: #58a6ff; }
  </style>

  <!-- Window Container -->
  <rect class="bg" x="1" y="1" width="798" height="338" rx="10" />
  
  <!-- Header Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 789 1 A 10 10 0 0 1 799 11 L 799 36 L 1 36 Z" fill="#161b22" />
  <line x1="1" y1="36" x2="799" y2="36" stroke="#30363d" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />
  <text x="76" y="22" class="header-title">stxnes@macbook-pro ~ % cat skills.json</text>

  <!-- Terminal Output -->
  <g class="term-text" transform="translate(24, 65)">
    <!-- Line 1 -->
    <g class="l1" transform="translate(0, 0)">
      <text x="0" y="0">
        <tspan class="prompt">stxnes@macbook-pro</tspan> <tspan class="path">~</tspan> % <tspan class="cmd">cat skills.json</tspan>
      </text>
    </g>

    <!-- Line 2 -->
    <g class="l2" transform="translate(0, 24)">
      <text x="0" y="0"><tspan class="bracket">{</tspan></text>
    </g>

    <!-- Line 3 -->
    <g class="l3" transform="translate(0, 48)">
      <text x="0" y="0">
        <tspan class="key">&nbsp;&nbsp;"Server &amp; Infrastructure":</tspan> [<tspan class="val">"Windows Server 2022"</tspan>, <tspan class="val">"AD DS"</tspan>, <tspan class="val">"GPOs"</tspan>, <tspan class="val">"OUs"</tspan>, <tspan class="val">"DNS/DHCP"</tspan>],
      </text>
    </g>

    <!-- Line 4 -->
    <g class="l4" transform="translate(0, 72)">
      <text x="0" y="0">
        <tspan class="key">&nbsp;&nbsp;"Identity &amp; Endpoints":</tspan> [<tspan class="val">"Microsoft Entra ID"</tspan>, <tspan class="val">"Intune"</tspan>, <tspan class="val">"SC-300 (Completed)"</tspan>, <tspan class="val">"MD-102 (Completed)"</tspan>],
      </text>
    </g>

    <!-- Line 5 -->
    <g class="l5" transform="translate(0, 96)">
      <text x="0" y="0">
        <tspan class="key">&nbsp;&nbsp;"Virtualization &amp; Cloud":</tspan> [<tspan class="val">"VMware ESXi/Workstation"</tspan>, <tspan class="val">"Hyper-V"</tspan>, <tspan class="val">"Azure"</tspan>, <tspan class="val">"GCP"</tspan>, <tspan class="val">"OCI"</tspan>],
      </text>
    </g>

    <!-- Line 6 -->
    <g class="l6" transform="translate(0, 120)">
      <text x="0" y="0">
        <tspan class="key">&nbsp;&nbsp;"Applied AI &amp; Workflows":</tspan> [<tspan class="val">"RAG Architecture"</tspan>, <tspan class="val">"LangChain"</tspan>, <tspan class="val">"LangGraph"</tspan>, <tspan class="val">"n8n"</tspan>, <tspan class="val">"FAISS"</tspan>],
      </text>
    </g>

    <!-- Line 7 -->
    <g class="l7" transform="translate(0, 144)">
      <text x="0" y="0">
        <tspan class="key">&nbsp;&nbsp;"Scripting &amp; Tools":</tspan> [<tspan class="val">"Python"</tspan>, <tspan class="val">"PowerShell"</tspan>, <tspan class="val">"C#"</tspan>, <tspan class="val">"SQL (PostgreSQL)"</tspan>, <tspan class="val">"Docker"</tspan>, <tspan class="val">"Git"</tspan>]
      </text>
    </g>

    <!-- Line 8 -->
    <g class="l8" transform="translate(0, 168)">
      <text x="0" y="0">
        <tspan class="bracket">}</tspan> <tspan class="success">[✓] PROFILE LOADED SUCCESSFULLY</tspan>
      </text>
      <rect class="cursor" x="285" y="-12" width="8" height="15" />
    </g>
  </g>
</svg>
